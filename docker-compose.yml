version: '3.7'

x-backend: &backend
  # Increase the version when changing Dockerfile or its arguments (below)
  image: rails-backend-template-${RAILS_ENV}:1.0.0
  build:
    args:
      DISTRO_NAME: 'bullseye'
      RUBY_VERSION: '3.1.2' # If you update this, update `.ruby-version` as well
      PG_MAJOR: '14' # If you update this, update the pg `image` version below
    context: .
    dockerfile: ./Dockerfile
    target: development
  volumes:
    - .:${APP_HOME} # Mac users may want to add `:cached` here
    - bundle:/usr/local/bundle
    - rails_cache:${APP_HOME}/tmp/cache
    - history:/usr/local/hist
    - ./docker/common/.bashrc:/root/.bashrc:ro
    - ./docker/common/.irbrc:/root/.irbrc:ro
    - ./docker/common/.psqlrc:/root/.psqlrc:ro
  env_file: .env
  environment:
    RAILS_ENV: ${RAILS_ENV:-development}
    MALLOC_ARENA_MAX: 2 # Use multiple mem pools to speed up malloc
    BOOTSNAP_CACHE_DIR: /usr/local/bundle/_bootsnap # Keep bootsnap in volumes
    XDG_DATA_HOME: /app/tmp/caches # RuboCop stores caches here, keep in volumes
    HISTFILE: /usr/local/hist/.bash_history
    IRB_HISTFILE: /usr/local/hist/.irb_history
    PSQL_HISTFILE: /usr/local/hist/.psql_history
  depends_on:
    - postgres
    - redis
  stdin_open: true
  tty: true
  tmpfs:
    - /tmp
    - ${APP_HOME}/tmp/pids

services:
  runner:
    <<: *backend
    command: /bin/bash

  rails:
    <<: *backend
    command: bundle exec puma -C config/puma/development.rb
    ports:
      - '3000:3000'

  sidekiq:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq.yml

  postgres:
    image: postgres:14 # Be sure to align this with `PG_MAJOR`
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - history:/user/local/hist
      - ./docker/common/.psqlrc:/root/.psqlrc:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_LOG_STATEMENTS: 'all'
      PSQL_HISTFILE: /user/local/hist/.psql_history
    ports:
      - 5432
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -h 127.0.0.1
      interval: 5s
    restart: always

  redis:
    image: redis:6.2-alpine
    volumes:
      - redisdata:/data
    ports:
      - 6379
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  bundle:
  postgresdata:
  history:
  rails_cache:
  redisdata:
